<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Delft Drop — a rainy day at the Thatch</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  :root{
    --night:#0F1626; --cream:#F8F1E1;
    --cobalt:#1F3A93; --cobalt-dk:#142457;
    --barrys:#C8102E; --ember:#E08A2E; --honey:#D9A036;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:linear-gradient(180deg,#0B1120 0%, var(--night) 55%, #1A2440 100%);
    font-family:Georgia,'Times New Roman',serif; color:var(--cream);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden; position:relative; padding:18px 10px 30px;
  }
  #rain{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
  .drop{position:absolute; top:-12vh; width:1px; height:9vh;
    background:linear-gradient(180deg, rgba(170,195,255,0) 0%, rgba(170,195,255,.4) 100%);
    animation:fall linear infinite;}
  @keyframes fall{to{transform:translateY(125vh);}}
  @media (prefers-reduced-motion: reduce){ .drop{display:none;} }

  .wrap{position:relative; z-index:1; width:min(94vw,430px); display:flex; flex-direction:column; gap:12px;}
  header{text-align:center; padding-top:4px;}
  h1{font-style:italic; font-weight:normal; letter-spacing:.14em; font-size:27px;}
  h1 b{color:#9FB4EF; font-weight:normal;}
  .sub{font-size:12.5px; color:#8DA0CF; letter-spacing:.06em; margin-top:3px; font-style:italic;}

  .stats{display:flex; gap:8px;}
  .stat{flex:1; background:rgba(248,241,225,.07); border:1px solid rgba(159,180,239,.25);
    border-radius:10px; padding:7px 4px 6px; text-align:center;}
  .stat .lbl{font-size:10.5px; letter-spacing:.1em; color:#8DA0CF; text-transform:uppercase; font-family:system-ui,sans-serif;}
  .stat .val{font-size:20px; font-family:system-ui,sans-serif; font-weight:600; margin-top:1px;}
  #potmeter{height:5px; border-radius:3px; background:rgba(159,180,239,.2); margin:5px 8px 1px; overflow:hidden;}
  #potfill{height:100%; width:0%; background:var(--barrys); border-radius:3px; transition:width .35s;}

  .boardcard{position:relative; background:var(--cream); border-radius:16px; padding:9px;
    box-shadow:0 12px 40px rgba(0,0,0,.5), inset 0 0 0 2px var(--cobalt), inset 0 0 0 5px var(--cream), inset 0 0 0 6px rgba(31,58,147,.35);}
  #board{display:grid; grid-template-columns:repeat(8,1fr); gap:5px; aspect-ratio:1/1; touch-action:manipulation;}
  .tile{background:#FDFAF2; border:1px solid rgba(31,58,147,.22); border-radius:8px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
    transition:transform .12s; position:relative;}
  .tile svg{width:64%; height:64%; display:block;}
  .tile.sel{outline:3px solid var(--cobalt); outline-offset:-2px; transform:scale(1.07); z-index:2;}
  .tile.pop{animation:pop .24s forwards;}
  @keyframes pop{60%{transform:scale(1.25); opacity:.9;} 100%{transform:scale(0); opacity:0;}}
  .tile.shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .tile.land{animation:land .22s;}
  @keyframes land{0%{transform:translateY(-26%); opacity:.4;}100%{transform:translateY(0); opacity:1;}}
  .tile.sp-line{background:repeating-linear-gradient(45deg,#FDFAF2 0 5px,#DDE5F9 5px 10px); border:1.6px solid var(--cobalt);}
  .tile.sp-blast{border:2px dashed var(--cobalt); background:#FDF6E4;}
  .tile.sp-blast::after{content:""; position:absolute; inset:14%; border:1.4px solid rgba(31,58,147,.45); border-radius:50%;}
  .tile.sp-bomb{background:var(--cobalt-dk); border:1.6px solid #9FB4EF; animation:glow 1.6s infinite alternate;}
  @keyframes glow{from{box-shadow:0 0 2px rgba(159,180,239,.4);}to{box-shadow:0 0 9px rgba(159,180,239,.9);}}

  #flavor{min-height:22px; text-align:center; font-style:italic; font-size:14px; color:#B9C7F2; letter-spacing:.02em;}

  .row{display:flex; gap:8px; justify-content:center;}
  button{font-family:Georgia,serif; font-size:14px; letter-spacing:.05em;
    background:transparent; color:var(--cream); border:1px solid rgba(159,180,239,.5);
    border-radius:9px; padding:8px 16px; cursor:pointer;}
  button:active{transform:scale(.97);}
  button.primary{background:var(--cobalt); border-color:var(--cobalt);}

  #overlay{position:absolute; inset:0; border-radius:16px; background:rgba(15,22,38,.82);
    display:none; align-items:center; justify-content:center; z-index:5;}
  #overlay.on{display:flex;}
  .panel{background:var(--cream); color:var(--cobalt-dk); border-radius:14px; padding:22px 20px;
    text-align:center; width:82%; border:2px solid var(--cobalt); box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .panel h2{font-style:italic; font-weight:normal; font-size:21px; margin-bottom:6px;}
  .panel p{font-size:14px; line-height:1.5; margin-bottom:14px; color:#3A3630;}
  .panel button{color:var(--cream);}
  footer{font-size:11px; color:#5F6C93; text-align:center; font-style:italic; letter-spacing:.05em; line-height:1.6;}
</style>
</head>
<body>
<div id="rain" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <h1>DELFT <b>DROP</b></h1>
    <div class="sub">a rainy day at the Thatch &mdash; match three, fill the pot</div>
  </header>

  <div class="stats">
    <div class="stat"><div class="lbl">Brew</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="lbl">Moves</div><div class="val" id="moves">30</div></div>
    <div class="stat"><div class="lbl">The pot</div><div class="val" id="pot">0/30</div><div id="potmeter"><div id="potfill"></div></div></div>
  </div>

  <div class="boardcard">
    <div id="board" role="grid" aria-label="Delft Drop game board"></div>
    <div id="overlay">
      <div class="panel">
        <h2 id="endtitle"></h2>
        <p id="endtext"></p>
        <button class="primary" onclick="reset()">Brew another</button>
      </div>
    </div>
  </div>

  <div id="flavor"></div>

  <div class="row">
    <button id="sndbtn" onclick="toggleSound()">Sound: off</button>
    <button onclick="reset()">Restart</button>
  </div>
  <footer>match 4 &rarr; the flue (clears row + column) &middot; 2&times;2 &rarr; Rook&rsquo;s pounce (3&times;3) &middot; match 5 &rarr; the Dax Star (swap with anything)<br>built for Kay by Dax &mdash; v2, same rainy Saturday</footer>
</div>

<script>
const SIZE=8, TYPES=6, GOAL=30, START_MOVES=30, TEA=0, BOMB=6;
let board=[], special=[], sel=null, busy=false, score=0, moves=START_MOVES, pot=0, over=false, lastSwap=null;

const COLORS=["#C8102E","#1F3A93","#E08A2E","#4A3B2C","#8A6D2F","#D9A036"];
function icon(t,sp){
  if(t===BOMB) return `<svg viewBox="0 0 24 24"><path fill="#F8F1E1" d="M12 2.6l2.5 6.1 6.5.5-5 4.3 1.6 6.4L12 16.4 6.4 19.9 8 13.5l-5-4.3 6.5-.5Z"/><circle fill="#9FB4EF" cx="19.5" cy="4.5" r="1.1"/></svg>`;
  const c=COLORS[t];
  switch(t){
    case 0: return `<svg viewBox="0 0 24 24"><path fill="${c}" d="M3.5 8h13v5.5A4.5 4.5 0 0 1 12 18H8a4.5 4.5 0 0 1-4.5-4.5Z"/><path fill="none" stroke="${c}" stroke-width="1.8" d="M16.5 9.5h1.6a2.6 2.6 0 0 1 0 5.2h-1.6"/><path fill="none" stroke="${c}" stroke-width="1.3" stroke-linecap="round" d="M8 5.5c0-1.2 1-1.3 1-2.5M12 5.5c0-1.2 1-1.3 1-2.5"/></svg>`;
    case 1: return `<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 2.5C12 2.5 5.2 10.4 5.2 14.6a6.8 6.8 0 0 0 13.6 0C18.8 10.4 12 2.5 12 2.5Z"/></svg>`;
    case 2: return `<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 2c1 3.5 5 5.5 5 10.5a5 5 0 0 1-10 0c0-2.8 2.4-4.4 1.8-7C10.2 7 11.5 5 12 2Z"/><path fill="#F8F1E1" d="M12 13c.9 1.4 1.6 1.9 1.6 3.2a1.9 1.9 0 0 1-3.8 0c0-1.3 1.3-1.8 2.2-3.2Z" opacity=".8"/></svg>`;
    case 3: return `<svg viewBox="0 0 24 24"><ellipse fill="${c}" cx="12" cy="15.5" rx="4.6" ry="3.9"/><circle fill="${c}" cx="6.6" cy="11" r="2"/><circle fill="${c}" cx="12" cy="8.6" r="2.1"/><circle fill="${c}" cx="17.4" cy="11" r="2"/></svg>`;
    case 4: return `<svg viewBox="0 0 24 24"><rect fill="${c}" x="10.4" y="2.6" width="3.2" height="3" rx="1"/><circle fill="none" stroke="${c}" stroke-width="2" cx="12" cy="13.4" r="6.6"/><path stroke="${c}" stroke-width="1.6" stroke-linecap="round" fill="none" d="M12 13.4V9.6M12 13.4l2.8 1.8"/></svg>`;
    case 5: return `<svg viewBox="0 0 24 24"><rect fill="${c}" x="6" y="8" width="12" height="12" rx="3.5"/><rect fill="${c}" x="7.2" y="4.6" width="9.6" height="2.8" rx="1.2"/><rect fill="#F8F1E1" x="8.4" y="12" width="7.2" height="3.6" rx="1" opacity=".85"/></svg>`;
  }
}

const LINES=["Rook has been deployed.","The teapot decides.","No horse detected.","Porcelain: unbroken.","Different league. Not even competition.","The lane let you through.","Five stone of consequence.","The stove approves.","Nothing gets to move off that couch.","Barry&rsquo;s. No substitutes."];
let lineIx=-1;
const HINT="tap a tile, then a neighbour &mdash; collect the Barry&rsquo;s";
function flavor(msg){document.getElementById('flavor').innerHTML=msg;}
function nextLine(){lineIx=(lineIx+1)%LINES.length; flavor(LINES[lineIx]);}

function randT(){return Math.floor(Math.random()*TYPES);}
function key(r,c){return r+","+c;}
function unkey(k){return k.split(',').map(Number);}

function genBoard(){
  board=[]; special=[];
  for(let r=0;r<SIZE;r++){board.push([]); special.push([]);
    for(let c=0;c<SIZE;c++){
      let t;
      do{t=randT();}
      while((c>=2&&board[r][c-1]===t&&board[r][c-2]===t)||(r>=2&&board[r-1][c]===t&&board[r-2][c]===t)||(r>=1&&c>=1&&board[r-1][c]===t&&board[r][c-1]===t&&board[r-1][c-1]===t));
      board[r].push(t); special[r].push(null);
    }}
  if(!hasMove())genBoard();
}

function findRuns(){
  const runs=[];
  for(let r=0;r<SIZE;r++){let run=1;
    for(let c=1;c<=SIZE;c++){
      if(c<SIZE&&board[r][c]>=0&&board[r][c]<BOMB&&board[r][c]===board[r][c-1])run++;
      else{if(run>=3){const cells=[];for(let k=c-run;k<c;k++)cells.push(key(r,k));runs.push({cells,len:run});} run=1;}
    }}
  for(let c=0;c<SIZE;c++){let run=1;
    for(let r=1;r<=SIZE;r++){
      if(r<SIZE&&board[r][c]>=0&&board[r][c]<BOMB&&board[r][c]===board[r-1][c])run++;
      else{if(run>=3){const cells=[];for(let k=r-run;k<r;k++)cells.push(key(k,c));runs.push({cells,len:run});} run=1;}
    }}
  return runs;
}
function findSquares(){
  const sqs=[];
  for(let r=0;r<SIZE-1;r++)for(let c=0;c<SIZE-1;c++){
    const t=board[r][c];
    if(t>=0&&t<BOMB&&board[r][c+1]===t&&board[r+1][c]===t&&board[r+1][c+1]===t)
      sqs.push({cells:[key(r,c),key(r,c+1),key(r+1,c),key(r+1,c+1)]});
  }
  return sqs;
}
function anyMatch(){return findRuns().length>0||findSquares().length>0;}
function swapCells(r1,c1,r2,c2){
  let t=board[r1][c1]; board[r1][c1]=board[r2][c2]; board[r2][c2]=t;
  t=special[r1][c1]; special[r1][c1]=special[r2][c2]; special[r2][c2]=t;
}
function hasMove(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(board[r][c]===BOMB)return true;
    if(c<SIZE-1){swapCells(r,c,r,c+1); const ok=anyMatch(); swapCells(r,c,r,c+1); if(ok)return true;}
    if(r<SIZE-1){swapCells(r,c,r+1,c); const ok=anyMatch(); swapCells(r,c,r+1,c); if(ok)return true;}
  }
  return false;
}
function mostCommonColor(){
  const n=Array(TYPES).fill(0);
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(board[r][c]>=0&&board[r][c]<BOMB)n[board[r][c]]++;
  let best=0; for(let i=1;i<TYPES;i++)if(n[i]>n[best])best=i; return best;
}
function expand(clear){
  const triggered=new Set();
  let grew=true;
  while(grew){grew=false;
    for(const k of [...clear]){
      if(triggered.has(k))continue;
      const [r,c]=unkey(k); const sp=special[r][c];
      if(!sp)continue;
      triggered.add(k); grew=true; boomFx=true;
      if(sp==='line'){for(let i=0;i<SIZE;i++){clear.add(key(r,i)); clear.add(key(i,c));}}
      else if(sp==='blast'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc; if(rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE)clear.add(key(rr,cc));}}
      else if(sp==='bomb'){const col=mostCommonColor(); for(let rr=0;rr<SIZE;rr++)for(let cc=0;cc<SIZE;cc++)if(board[rr][cc]===col)clear.add(key(rr,cc));}
    }}
}
let boomFx=false;

function render(landSet){
  const b=document.getElementById('board'); b.innerHTML='';
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const d=document.createElement('div');
    d.className='tile'; d.dataset.r=r; d.dataset.c=c;
    const sp=special[r][c];
    if(sp)d.classList.add('sp-'+sp);
    if(sel&&sel[0]===r&&sel[1]===c)d.classList.add('sel');
    if(landSet&&landSet.has(key(r,c)))d.classList.add('land');
    d.innerHTML=icon(board[r][c],sp);
    b.appendChild(d);
  }
  document.getElementById('score').textContent=score;
  document.getElementById('moves').textContent=moves;
  document.getElementById('pot').textContent=Math.min(pot,GOAL)+"/"+GOAL;
  document.getElementById('potfill').style.width=Math.min(100,pot/GOAL*100)+"%";
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

document.getElementById('board').addEventListener('click', e=>{
  if(busy||over)return;
  const t=e.target.closest('.tile'); if(!t)return;
  const r=+t.dataset.r, c=+t.dataset.c;
  if(!sel){sel=[r,c]; blipSel(); render(); return;}
  if(sel[0]===r&&sel[1]===c){sel=null; render(); return;}
  const dr=Math.abs(sel[0]-r), dc=Math.abs(sel[1]-c);
  if(dr+dc===1){trySwap(sel[0],sel[1],r,c);}
  else{sel=[r,c]; blipSel(); render();}
});

async function trySwap(r1,c1,r2,c2){
  busy=true;
  const b1=board[r1][c1]===BOMB, b2=board[r2][c2]===BOMB;
  if(b1||b2){
    moves--; sel=null; melodyStep=0;
    const clear=new Set([key(r1,c1),key(r2,c2)]);
    if(b1&&b2){for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)clear.add(key(r,c)); flavor("Both stars. The whole sky goes.");}
    else{
      const col=b1?board[r2][c2]:board[r1][c1];
      if(col>=0&&col<BOMB){for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(board[r][c]===col)clear.add(key(r,c));}
      flavor("The Dax Star &mdash; named beside Cassiopeia, clears the board.");
    }
    expand(clear);
    await clearAndFall(clear,1);
    await resolve(2,false);
    busy=false; endCheck(); return;
  }
  swapCells(r1,c1,r2,c2);
  if(!anyMatch()){
    swapCells(r1,c1,r2,c2);
    render();
    const bd=document.getElementById('board');
    [[r1,c1],[r2,c2]].forEach(([r,c])=>{bd.children[r*SIZE+c].classList.add('shake');});
    blipBad();
    await sleep(300); sel=null; render(); busy=false; return;
  }
  moves--; sel=null; lastSwap=[key(r1,c1),key(r2,c2)]; melodyStep=0;
  await resolve(1,true);
  lastSwap=null;
  busy=false; endCheck();
}

function pickSpawn(cells){
  if(lastSwap){for(const s of lastSwap)if(cells.includes(s))return s;}
  return cells[Math.floor(cells.length/2)];
}

async function resolve(startCascade, announce){
  let cascade=startCascade-1;
  while(true){
    const runs=findRuns(), squares=findSquares();
    if(!runs.length&&!squares.length)break;
    cascade++;
    boomFx=false;
    const runCellSet=new Set(); runs.forEach(r=>r.cells.forEach(k=>runCellSet.add(k)));
    const spawns=[];
    for(const run of runs){
      if(run.len>=5)spawns.push({k:pickSpawn(run.cells),sp:'bomb'});
      else if(run.len===4)spawns.push({k:pickSpawn(run.cells),sp:'line'});
    }
    for(const sq of squares){
      if(sq.cells.some(k=>runCellSet.has(k)))continue;
      spawns.push({k:pickSpawn(sq.cells),sp:'blast'});
    }
    const spawnKeys=new Set(spawns.map(s=>s.k));
    const clear=new Set();
    runs.forEach(r=>r.cells.forEach(k=>{if(!spawnKeys.has(k))clear.add(k);}));
    squares.forEach(s=>s.cells.forEach(k=>{if(!spawnKeys.has(k))clear.add(k);}));
    expand(clear);
    spawnKeys.forEach(k=>clear.delete(k));
    for(const s of spawns){
      const [r,c]=unkey(s.k);
      if(s.sp==='bomb'){board[r][c]=BOMB; special[r][c]='bomb'; flavor("A Dax Star forms &mdash; swap it with anything.");}
      else{special[r][c]=s.sp; if(s.sp==='line')flavor("The flue opens &mdash; match it to clear the cross."); else flavor("Rook coils to pounce &mdash; match it for the 3&times;3.");}
    }
    await clearAndFall(clear,cascade);
    if(announce&&cascade===2&&!spawns.length)nextLine();
    if(cascade>=3)flavor("Chain of "+cascade+" &mdash; the house goes quiet.");
  }
  if(!hasMove()&&!over){flavor("The lane rearranged itself."); genBoard(); render();}
}

async function clearAndFall(clear,cascade){
  score+=clear.size*10*cascade;
  let teaHit=0;
  clear.forEach(k=>{const[r,c]=unkey(k); if(board[r][c]===TEA)teaHit++;});
  pot+=teaHit;
  render();
  const bd=document.getElementById('board');
  clear.forEach(k=>{const[r,c]=unkey(k); bd.children[r*SIZE+c].classList.add('pop');});
  playMelody(cascade, clear.size, boomFx);
  await sleep(240);
  clear.forEach(k=>{const[r,c]=unkey(k); board[r][c]=-1; special[r][c]=null;});
  const landed=new Set();
  for(let c=0;c<SIZE;c++){
    let write=SIZE-1;
    for(let r=SIZE-1;r>=0;r--){
      if(board[r][c]!==-1){
        if(write!==r){board[write][c]=board[r][c]; special[write][c]=special[r][c]; board[r][c]=-1; special[r][c]=null; landed.add(key(write,c));}
        write--;
      }
    }
    for(let r=write;r>=0;r--){board[r][c]=randT(); special[r][c]=null; landed.add(key(r,c));}
  }
  render(landed);
  await sleep(160);
}

function endCheck(){
  if(pot>=GOAL)finish(true);
  else if(moves<=0)finish(false);
}
function finish(win){
  over=true;
  document.getElementById('endtitle').textContent = win? "Pot\u2019s full." : "Out of moves.";
  document.getElementById('endtext').innerHTML = win
    ? "Barry\u2019s achieved &mdash; "+score+" brew. The whole house goes silent in that specific way a house does when everyone in it has let go."
    : "The rain keeps on. "+score+" brew, "+Math.min(pot,GOAL)+" of "+GOAL+" cups in the pot. The Thatch will still be here.";
  document.getElementById('overlay').classList.add('on');
  playEnd(win);
}
function reset(){
  score=0; moves=START_MOVES; pot=0; over=false; sel=null; lineIx=-1; lastSwap=null;
  document.getElementById('overlay').classList.remove('on');
  genBoard(); render(); flavor(HINT);
}

(function(){
  const rain=document.getElementById('rain');
  for(let i=0;i<44;i++){
    const d=document.createElement('div'); d.className='drop';
    d.style.left=(Math.random()*100)+"vw";
    d.style.animationDuration=(0.9+Math.random()*1.4)+"s";
    d.style.animationDelay=(Math.random()*2)+"s";
    d.style.opacity=0.35+Math.random()*0.45;
    rain.appendChild(d);
  }
})();

/* ---------- sound: the cascade is a melody ---------- */
const SCALE=["D4","F4","G4","A4","C5","D5","F5","G5","A5","C6"];
let snd=false, synth=null, bass=null, noise=null, loop=null, ready=false, melodyStep=0;
async function initAudio(){
  if(ready||typeof Tone==='undefined')return;
  await Tone.start();
  synth=new Tone.PolySynth(Tone.Synth,{volume:-13, envelope:{attack:.004,decay:.18,sustain:.05,release:.5}}).toDestination();
  bass=new Tone.Synth({oscillator:{type:"sine"},volume:-12, envelope:{attack:.01,decay:.3,sustain:.1,release:.6}}).toDestination();
  const filt=new Tone.Filter(900,"lowpass").toDestination();
  noise=new Tone.Noise({type:"pink",volume:-30}).connect(filt);
  const pad=new Tone.Synth({oscillator:{type:"triangle"},volume:-25, envelope:{attack:.4,decay:.5,sustain:.3,release:2}}).toDestination();
  const padNotes=["D3","F3","A3","C4","A3","F3"]; let i=0;
  loop=new Tone.Loop(time=>{pad.triggerAttackRelease(padNotes[i%padNotes.length],"2n",time); i++;},"2n");
  ready=true;
}
async function toggleSound(){
  if(typeof Tone==='undefined'){flavor("no sound engine in reach &mdash; the rain will have to do"); return;}
  try{
    await initAudio();
    snd=!snd;
    document.getElementById('sndbtn').textContent="Sound: "+(snd?"on":"off");
    if(snd){noise.start(); Tone.Transport.start(); loop.start(0);}
    else{noise.stop(); loop.stop(); Tone.Transport.stop();}
  }catch(e){}
}
function playMelody(cascade,size,boom){
  if(!snd||!ready)return;
  try{
    const now=Tone.now();
    const base=Math.min(melodyStep, SCALE.length-3);
    const count=Math.min(3, 1+Math.floor(size/4));
    for(let i=0;i<count;i++)synth.triggerAttackRelease(SCALE[base+i],0.14, now+i*0.075);
    if(boom)bass.triggerAttackRelease("D2",0.3, now);
    melodyStep=Math.min(melodyStep+1, SCALE.length-3);
  }catch(e){}
}
function blipSel(){if(snd&&ready){try{synth.triggerAttackRelease("A5",0.04);}catch(e){}}}
function blipBad(){if(snd&&ready){try{synth.triggerAttackRelease("D3",0.08);}catch(e){}}}
function playEnd(win){
  if(!snd||!ready)return;
  try{
    const now=Tone.now();
    const seq=win?["D4","F4","A4","D5","F5"]:["A3","F3","D3"];
    seq.forEach((n,i)=>synth.triggerAttackRelease(n,0.3, now+i*0.12));
  }catch(e){}
}

reset(); flavor(HINT);
