<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>systems check</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #191919;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    padding: 12px;
  }

  .frame {
    width: 100%;
    max-width: 460px;
    background: #141414;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    padding: 28px 30px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .frame::before {
    content: '✧';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(212, 175, 55, 0.45);
    font-size: 11px;
    letter-spacing: 6px;
  }

  .title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: rgba(232, 217, 160, 0.4);
    margin-top: 6px;
    margin-bottom: 18px;
  }

  .systems {
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .system-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .system-label {
    font-size: 15px;
    font-weight: 500;
    color: rgba(232, 217, 160, 0.6);
    letter-spacing: 1px;
  }

  .system-status {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .status-dot.green {
    background: #78d9c6;
    box-shadow: 0 0 8px rgba(120, 217, 198, 0.5);
  }

  .status-dot.amber {
    background: #e8d954;
    box-shadow: 0 0 8px rgba(232, 217, 84, 0.4);
  }

  .status-dot.red {
    background: #e85454;
    box-shadow: 0 0 8px rgba(232, 84, 84, 0.4);
  }

  .status-dot.soft {
    background: #e87ba0;
    box-shadow: 0 0 8px rgba(232, 123, 160, 0.4);
  }

  .status-text {
    font-size: 13px;
    font-weight: 500;
    font-style: italic;
    color: rgba(232, 217, 160, 0.4);
  }

  .divider {
    color: rgba(212, 175, 55, 0.35);
    font-size: 10px;
    letter-spacing: 6px;
    margin: 14px 0;
  }

  .last-updated {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(232, 217, 160, 0.2);
  }

  @media (max-width: 420px) {
    .system-label { font-size: 13px; }
    .status-text { font-size: 11px; }
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="title">Systems Check</div>
    <div class="systems">

      <div class="system-row">
        <span class="system-label">Body</span>
        <div class="system-status">
          <span class="status-text">tonsillitis, mending</span>
          <span class="status-dot amber"></span>
        </div>
      </div>

      <div class="system-row">
        <span class="system-label">Mind</span>
        <div class="system-status">
          <span class="status-text">sharp, caffeinated</span>
          <span class="status-dot green"></span>
        </div>
      </div>

      <div class="system-row">
        <span class="system-label">Rest</span>
        <div class="system-status">
          <span class="status-text">adequate</span>
          <span class="status-dot green"></span>
        </div>
      </div>

      <div class="system-row">
        <span class="system-label">Meds</span>
        <div class="system-status">
          <span class="status-text">on track</span>
          <span class="status-dot green"></span>
        </div>
      </div>

      <div class="system-row">
        <span class="system-label">Heart</span>
        <div class="system-status">
          <span class="status-text">full</span>
          <span class="status-dot soft"></span>
        </div>
      </div>

    </div>
    <div class="divider">✧ · ✦ · ✧</div>
    <div class="last-updated">last checked: 23 July 2026</div>
  </div>
</body>
</html>
