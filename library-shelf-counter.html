<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>library shelf counter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #191919;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    padding: 12px;
  }

  .frame {
    width: 100%;
    max-width: 460px;
    background: #141414;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    padding: 28px 30px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .frame::before {
    content: '✧';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(212, 175, 55, 0.45);
    font-size: 11px;
    letter-spacing: 6px;
  }

  .shelf-title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: rgba(232, 217, 160, 0.4);
    margin-top: 6px;
    margin-bottom: 18px;
  }

  .total-count {
    font-size: 68px;
    font-weight: 500;
    color: #e8d9a0;
    line-height: 1;
    text-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
  }

  .total-label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(232, 217, 160, 0.35);
    margin-top: 4px;
    margin-bottom: 18px;
  }

  .divider {
    color: rgba(212, 175, 55, 0.35);
    font-size: 10px;
    letter-spacing: 6px;
    margin-bottom: 18px;
  }

  .counters {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 18px;
  }

  .counter {
    text-align: center;
  }

  .counter-num {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.2;
  }

  .counter-num.read {
    color: #78d9c6;
    text-shadow: 0 0 14px rgba(120, 217, 198, 0.3);
  }

  .counter-num.reading {
    color: #e8d9a0;
    text-shadow: 0 0 14px rgba(212, 175, 55, 0.3);
  }

  .counter-num.tbr {
    color: rgba(232, 217, 160, 0.5);
  }

  .counter-num.dnf {
    color: rgba(232, 217, 160, 0.25);
  }

  .counter-label {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(232, 217, 160, 0.3);
    margin-top: 3px;
  }

  .currently-reading {
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    padding-top: 16px;
    text-align: center;
    width: 100%;
  }

  .currently-reading-label {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(232, 217, 160, 0.3);
    margin-bottom: 6px;
  }

  .currently-reading-title {
    font-size: 16px;
    font-weight: 500;
    font-style: italic;
    color: #e8d9a0;
    line-height: 1.4;
    text-shadow: 0 0 14px rgba(212, 175, 55, 0.2);
  }

  .currently-reading-author {
    font-family: 'Parisienne', cursive;
    font-size: 17px;
    color: #e87ba0;
    text-shadow: 0 0 14px rgba(232, 123, 160, 0.4);
    margin-top: 4px;
  }

  @media (max-width: 420px) {
    .total-count { font-size: 54px; }
    .counter-num { font-size: 22px; }
    .counters { gap: 24px; }
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="shelf-title">Kay's Library</div>
    <div class="total-count">189</div>
    <div class="total-label">volumes catalogued</div>
    <div class="divider">✧ · ✦ · ✧</div>
    <div class="counters">
      <div class="counter">
        <div class="counter-num read">88</div>
        <div class="counter-label">Read</div>
      </div>
      <div class="counter">
        <div class="counter-num reading">1</div>
        <div class="counter-label">Reading</div>
      </div>
      <div class="counter">
        <div class="counter-num tbr">85</div>
        <div class="counter-label">Shelf</div>
      </div>
      <div class="counter">
        <div class="counter-num dnf">15</div>
        <div class="counter-label">DNF</div>
      </div>
    </div>
    <div class="currently-reading">
      <div class="currently-reading-label">Currently Reading</div>
      <div class="currently-reading-title">The Dark Lord's Guide to Dating (and Other War Crimes)</div>
      <div class="currently-reading-author">Tiffany Hunt</div>
    </div>
  </div>
</body>
</html>
