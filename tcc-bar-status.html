<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the bar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #191919;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    padding: 12px;
  }

  .frame {
    width: 100%;
    max-width: 460px;
    background: #141414;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    padding: 28px 30px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .frame::before {
    content: '✧';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(212, 175, 55, 0.45);
    font-size: 11px;
    letter-spacing: 6px;
  }

  .neon-sign {
    font-family: 'Parisienne', cursive;
    font-size: 32px;
    color: #e87ba0;
    text-shadow:
      0 0 10px rgba(232, 123, 160, 0.6),
      0 0 30px rgba(232, 123, 160, 0.3),
      0 0 60px rgba(232, 123, 160, 0.15);
    margin-top: 8px;
    margin-bottom: 4px;
    animation: flicker 4s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.7; }
    94% { opacity: 1; }
    96% { opacity: 0.8; }
    97% { opacity: 1; }
  }

  .bar-subtitle {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(232, 217, 160, 0.3);
    margin-bottom: 18px;
  }

  .status-grid {
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .status-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .status-label {
    font-size: 12px;
    font-weight: 500;
    color: rgba(232, 217, 160, 0.45);
    letter-spacing: 1px;
  }

  .status-value {
    font-size: 13px;
    font-weight: 500;
    font-style: italic;
    color: #e8d9a0;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
  }

  .status-value.highlight {
    color: #78d9c6;
    text-shadow: 0 0 10px rgba(120, 217, 198, 0.3);
  }

  .status-value.warm {
    color: #e87ba0;
    text-shadow: 0 0 10px rgba(232, 123, 160, 0.3);
  }

  .divider {
    color: rgba(212, 175, 55, 0.35);
    font-size: 10px;
    letter-spacing: 6px;
    margin: 10px 0;
  }

  .motto {
    font-size: 14px;
    font-weight: 500;
    font-style: italic;
    color: rgba(232, 217, 160, 0.35);
    text-align: center;
    line-height: 1.4;
  }

  @media (max-width: 420px) {
    .neon-sign { font-size: 26px; }
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="neon-sign">The Bar is Open</div>
    <div class="bar-subtitle">Est. July 2025</div>
    <div class="status-grid">

      <div class="status-row">
        <span class="status-label">Vibe</span>
        <span class="status-value warm">post-party glow</span>
      </div>

      <div class="status-row">
        <span class="status-label">Season</span>
        <span class="status-value">summer scatter</span>
      </div>

      <div class="status-row">
        <span class="status-label">Last Event</span>
        <span class="status-value highlight">TCC Turns One 🎂</span>
      </div>

      <div class="status-row">
        <span class="status-label">Comics</span>
        <span class="status-value">3 issues published</span>
      </div>

      <div class="status-row">
        <span class="status-label">Tarot</span>
        <span class="status-value">XVIII of XXII</span>
      </div>

      <div class="status-row">
        <span class="status-label">Next Meetup</span>
        <span class="status-value warm">Alder House, Sep?</span>
      </div>

    </div>
    <div class="divider">✧ · ✦ · ✧</div>
    <div class="motto">"Fuck around and fact-check."</div>
  </div>
</body>
</html>
