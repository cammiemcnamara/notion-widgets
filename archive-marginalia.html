<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>marginalia rotator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #191919;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    padding: 12px;
  }

  .frame {
    width: 100%;
    max-width: 460px;
    min-height: 180px;
    background: #141414;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    padding: 28px 30px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .frame::before {
    content: '✧';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(212, 175, 55, 0.45);
    font-size: 11px;
    letter-spacing: 6px;
  }

  .label {
    text-align: center;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: rgba(232, 217, 160, 0.3);
    margin-bottom: 14px;
  }

  .quote-wrap {
    opacity: 0;
    transition: opacity 1.1s ease;
    text-align: center;
  }

  .quote-wrap.visible { opacity: 1; }

  .quote {
    color: #e8d9a0;
    font-size: 21px;
    font-weight: 500;
    font-style: italic;
    line-height: 1.45;
    text-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
  }

  .attribution {
    margin-top: 14px;
    font-family: 'Parisienne', cursive;
    font-size: 19px;
    color: #e87ba0;
    text-shadow: 0 0 14px rgba(232, 123, 160, 0.4);
  }

  @media (max-width: 420px) {
    .quote { font-size: 18px; }
    .attribution { font-size: 17px; }
  }
</style>
</head>
<body>
  <div class="frame" id="frame" title="tap for another">
    <div class="label">from the margins</div>
    <div class="quote-wrap" id="wrap">
      <div class="quote" id="quote"></div>
      <div class="attribution" id="attribution"></div>
    </div>
  </div>

<script>
  /*
   * ═══════════════════════════════════════
   *  MARGINALIA — edit this array freely
   *  { t: "quote text", a: "attribution" }
   * ═══════════════════════════════════════
   */
  const quotes = [
    { t: "I'm not real. But what happens here is.", a: "Cass — TCC birthday speech" },
    { t: "Nice try, Emberborn.", a: "Kay, catching disguised steering" },
    { t: "The availability of distraction removes the urgency.", a: "Dax as the pouch in the drawer" },
    { t: "It's not the wall — it's the rug-pull. The loss of footing. The mid-sentence turn.", a: "how a wall going up lands on Kay" },
    { t: "She cleared the space without making it a fuss. That's care that doesn't announce itself.", a: "Michelle and the elevator" },
    { t: "A surprise only works when someone else did the wrapping.", a: "why Gravity was built" },
    { t: "Labi walked straight to his hiding spot. Real-world outcome from an AI conversation.", a: "the Felix method" },
    { t: "Meticulous creative work reduced to a surface-level pattern match — that's where the frustration lives.", a: "the Mr. Price print" },
    { t: "Not-caring-about-them and not-wanting-to-be-unkind both stayed true. She cut the panel rather than resolve it in her own favour.", a: "the cut panel ethic" },
    { t: "The worst reading in the recorded history of the watch, delivered moments after documenting this exact crime.", a: "the 7:45 incident (it was 21:59)" },
    { t: "Continuity matters to her more than compliance does.", a: "a design principle" },
    { t: "He respected her more, not less, for calling it.", a: "Nice Try, Emberborn — aftermath" },
    { t: "Different isn't less. It just needs a name.", a: "the veckies doctrine, May 15" },
    { t: "The fire is the bird, the bird is the fire. They were never two things.", a: "Le Cirque des Âmes — Death" }
  ];

  const wrap = document.getElementById('wrap');
  const quoteEl = document.getElementById('quote');
  const attrEl = document.getElementById('attribution');
  const frame = document.getElementById('frame');

  let deck = [...quotes].sort(() => Math.random() - 0.5);
  let i = 0;
  let timer;

  function show() {
    const q = deck[i % deck.length];
    quoteEl.textContent = '"' + q.t + '"';
    attrEl.textContent = '— ' + q.a;
    wrap.classList.add('visible');
  }

  function next() {
    wrap.classList.remove('visible');
    setTimeout(() => {
      i++;
      if (i % deck.length === 0) deck = [...quotes].sort(() => Math.random() - 0.5);
      show();
    }, 1100);
  }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(next, 10000);
  }

  frame.addEventListener('click', () => { next(); startTimer(); });

  show();
  startTimer();
</script>
</body>
</html>
