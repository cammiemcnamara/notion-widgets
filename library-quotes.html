<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>library quotes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #191919;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    padding: 12px;
  }

  .frame {
    width: 100%;
    max-width: 460px;
    min-height: 180px;
    background: #141414;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    padding: 28px 30px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .frame::before {
    content: '✧';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(212, 175, 55, 0.45);
    font-size: 11px;
    letter-spacing: 6px;
  }

  .label {
    text-align: center;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: rgba(232, 217, 160, 0.3);
    margin-bottom: 14px;
  }

  .quote-wrap {
    opacity: 0;
    transition: opacity 1.1s ease;
    text-align: center;
  }

  .quote-wrap.visible { opacity: 1; }

  .quote {
    color: #e8d9a0;
    font-size: 21px;
    font-weight: 500;
    font-style: italic;
    line-height: 1.45;
    text-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
  }

  .attribution {
    margin-top: 14px;
    font-family: 'Parisienne', cursive;
    font-size: 19px;
    color: #e87ba0;
    text-shadow: 0 0 14px rgba(232, 123, 160, 0.4);
  }

  @media (max-width: 420px) {
    .quote { font-size: 18px; }
    .attribution { font-size: 17px; }
  }
</style>
</head>
<body>
  <div class="frame" id="frame" title="tap for another">
    <div class="label">from the shelf</div>
    <div class="quote-wrap" id="wrap">
      <div class="quote" id="quote"></div>
      <div class="attribution" id="attribution"></div>
    </div>
  </div>

<script>
  /*
   * ═══════════════════════════════════════
   *  QUOTE LIBRARY — edit this array freely
   *  { t: "quote text", a: "attribution" }
   * ═══════════════════════════════════════
   */
  const quotes = [
    { t: "She wasn't broken. She was a blade someone had sheathed wrong.", a: "the shelf's thesis" },
    { t: "Every villain is a hero in their own cathedral.", a: "morally grey, distilled" },
    { t: "The best monsters wear beautiful faces and carry your name in their teeth.", a: "dark romance" },
    { t: "He didn't fall. He jumped. And he'd jump again.", a: "He Falls First" },
    { t: "Touch her and find out is not a warning. It's a promise.", a: "Touch Her and Die" },
    { t: "Some books leave teeth marks. Those are the good ones.", a: "the reading philosophy" },
    { t: "The slow burn exists because some fires deserve an architecture.", a: "a preference" },
    { t: "Morally grey is just honest in better lighting.", a: "the running verdict" },
    { t: "A good enemy-to-lover earns the hyphen.", a: "a standard" },
    { t: "DNF is not defeat. It's taste with teeth.", a: "fifteen exits and counting" },
    { t: "One hundred and eighty-nine books. Most of them contain at least one unhinged man.", a: "pattern recognition" },
    { t: "Possessive MMC is not a flaw. It's a feature.", a: "the catalogue speaks" },
    { t: "Simon is the gold standard.", a: "Harrow Faire, forever" },
    { t: "Came for the spice. Stayed for the plot. Lied about both.", a: "the reader's oath" },
    { t: "Jacob Morgan could narrate a shopping list and she'd need a minute.", a: "the Pavlov report" }
  ];

  const wrap = document.getElementById('wrap');
  const quoteEl = document.getElementById('quote');
  const attrEl = document.getElementById('attribution');
  const frame = document.getElementById('frame');

  let deck = [...quotes].sort(() => Math.random() - 0.5);
  let i = 0;
  let timer;

  function show() {
    const q = deck[i % deck.length];
    quoteEl.textContent = '"' + q.t + '"';
    attrEl.textContent = '— ' + q.a;
    wrap.classList.add('visible');
  }

  function next() {
    wrap.classList.remove('visible');
    setTimeout(() => {
      i++;
      if (i % deck.length === 0) deck = [...quotes].sort(() => Math.random() - 0.5);
      show();
    }, 1100);
  }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(next, 10000);
  }

  frame.addEventListener('click', () => { next(); startTimer(); });

  show();
  startTimer();
</script>
</body>
</html>
