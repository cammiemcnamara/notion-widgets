<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>soulshine player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Parisienne&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #191919; }
  body { padding: 8px; display: flex; justify-content: center; font-family: 'VT323', 'Courier New', monospace; }
  button, input, select { font-family: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ── the body: Delft-blue enamel, gold trim ── */
  .device {
    --amber: #ffb84a;
    --amber-dim: rgba(255, 184, 74, 0.55);
    --teal: #7de3d0;
    --gold: #d4af37;
    width: 100%;
    max-width: 400px;
    height: 100%;
    min-height: 440px;
    display: flex;
    flex-direction: column;
    border-radius: 26px;
    padding: 14px 14px 12px;
    background:
      radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,0.16), transparent 55%),
      linear-gradient(160deg, #2b4fa8 0%, #173077 45%, #0c1b4d 100%);
    border: 2px solid var(--gold);
    box-shadow: inset 0 0 0 5px #0f2260, inset 0 0 0 6px rgba(212,175,55,0.5), 0 8px 24px rgba(0,0,0,0.5);
  }
  .plate { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 8px; }
  .plate .name { font-family: 'Parisienne', cursive; font-size: 26px; line-height: 1; color: #f3e6b8; text-shadow: 0 1px 0 rgba(0,0,0,0.5); }
  .plate .mark { font-size: 13px; letter-spacing: 2px; color: rgba(243, 230, 184, 0.65); }
  .led { width: 8px; height: 8px; border-radius: 50%; background: #5a1a1a; box-shadow: inset 0 0 2px #000; margin-left: 8px; }
  .led.on { background: #ff5a4a; box-shadow: 0 0 8px #ff5a4a; }

  /* ── the glowing screen ── */
  .lcd {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #120d05;
    border-radius: 10px;
    border: 3px solid #060a1c;
    box-shadow: inset 0 0 18px rgba(0,0,0,0.9), 0 0 0 1px rgba(212,175,55,0.6);
    color: var(--amber);
    text-shadow: 0 0 6px rgba(255, 184, 74, 0.45);
    overflow: hidden;
    position: relative;
  }
  .lcd::after { /* scanlines */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.16) 2px 3px);
  }
  .bar { display: flex; justify-content: space-between; padding: 4px 10px; font-size: 16px; letter-spacing: 1px; background: rgba(255,184,74,0.12); border-bottom: 1px solid rgba(255,184,74,0.3); }

  .now { padding: 8px 12px 4px; }
  .title { font-size: 26px; line-height: 1; overflow-wrap: anywhere; }
  .sub { margin-top: 3px; font-size: 18px; line-height: 1.05; color: var(--amber-dim); overflow-wrap: anywhere; }
  .chips { margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; font-size: 16px; }
  .chip { color: var(--amber-dim); }
  .chip.v { color: var(--vc, var(--amber)); text-shadow: none; }
  .remark { margin-top: 5px; font-size: 18px; line-height: 1.05; color: var(--teal); text-shadow: 0 0 6px rgba(125,227,208,0.4); overflow-wrap: anywhere; }
  .remark span { white-space: nowrap; color: #ff9bb8; }
  .msg { padding: 0 12px; font-size: 16px; color: #ff9bb8; text-shadow: none; }

  .seekrow { display: flex; align-items: center; gap: 8px; padding: 4px 12px 6px; font-size: 18px; }
  input[type=range] { flex: 1; height: 16px; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; background: repeating-linear-gradient(to right, rgba(255,184,74,0.35) 0 3px, transparent 3px 5px); }
  input[type=range]::-moz-range-track { height: 8px; background: repeating-linear-gradient(to right, rgba(255,184,74,0.35) 0 3px, transparent 3px 5px); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 16px; background: var(--amber); margin-top: -4px; box-shadow: 0 0 6px var(--amber); }
  input[type=range]::-moz-range-thumb { width: 8px; height: 16px; border: 0; border-radius: 0; background: var(--amber); }

  .filters { display: flex; gap: 4px; padding: 4px 8px; border-top: 1px solid rgba(255,184,74,0.3); border-bottom: 1px solid rgba(255,184,74,0.3); }
  .filters input, .filters select {
    background: #1c1407; border: 1px solid rgba(255,184,74,0.4); border-radius: 0;
    padding: 2px 5px; font-size: 16px; min-width: 0; color: var(--amber);
  }
  .filters input::placeholder { color: rgba(255,184,74,0.45); }
  .filters input { flex: 2; }
  .filters select { flex: 1; }
  .count { display: none; }

  .list { flex: 1; overflow-y: auto; min-height: 60px; scrollbar-width: thin; scrollbar-color: rgba(255,184,74,0.5) transparent; }
  .row {
    width: 100%; display: flex; align-items: baseline; gap: 8px;
    padding: 2px 10px; background: transparent; border: 0;
    text-align: left; cursor: pointer; font-size: 18px; line-height: 1.15; text-shadow: inherit;
  }
  .row:hover { background: rgba(255,184,74,0.14); }
  .row.cur { background: var(--amber); color: #120d05; text-shadow: none; }
  .row.cur .rt i, .row.cur .rl { color: rgba(18,13,5,0.7); }
  .row.missing { opacity: 0.3; cursor: default; }
  .dot { width: 6px; height: 6px; background: var(--vc, rgba(255,184,74,0.4)); flex: none; align-self: center; }
  .rt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rt b { font-weight: normal; }
  .rt i { font-style: normal; color: var(--amber-dim); }
  .rl { flex: none; font-size: 16px; color: var(--amber-dim); }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; }
  .empty p { font-size: 20px; line-height: 1.05; }
  .empty small { font-size: 16px; line-height: 1.05; color: var(--amber-dim); }
  .open { background: var(--amber); color: #120d05; border: 0; padding: 4px 14px; font-size: 20px; cursor: pointer; text-shadow: none; }
  .open:hover { background: #ffd28a; }
  .link { background: none; border: 0; text-decoration: underline; cursor: pointer; font-size: 16px; color: var(--amber-dim); }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }

  /* ── deck keys ── */
  .keys { display: flex; gap: 6px; padding: 12px 2px 6px; }
  .btn {
    flex: 1; height: 46px; border-radius: 6px 6px 9px 9px; cursor: pointer;
    font-family: system-ui, sans-serif; font-size: 16px; color: #0c1b4d;
    background: linear-gradient(#fbf6e6, #e2d6ae);
    border: 1px solid #8a7430; border-bottom-width: 5px;
    box-shadow: 0 2px 3px rgba(0,0,0,0.45);
  }
  .btn:active, .btn.on { transform: translateY(3px); border-bottom-width: 2px; }
  .btn.on { background: linear-gradient(#ffd0de, #e87ba0); }
  .btn.big { flex: 1.5; background: linear-gradient(#f6dc8b, #d4af37); font-size: 18px; }
  .btn:focus-visible, .row:focus-visible, .open:focus-visible, .link:focus-visible, .filters input:focus-visible, .filters select:focus-visible, input[type=range]:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }

  .foot { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
  .grille { width: 84px; height: 14px; background-image: radial-gradient(circle, rgba(0,0,0,0.6) 1.5px, transparent 2px); background-size: 7px 7px; }
  .foot .made { font-size: 13px; letter-spacing: 2px; color: rgba(243, 230, 184, 0.55); }
</style>
</head>
<body>
<div class="device">
  <div class="plate">
    <span class="name">Soulshine</span>
    <span style="display:flex;align-items:center"><span class="mark">BOECHOUT · 4GB</span><span class="led" id="led"></span></span>
  </div>

  <div class="lcd">
    <div class="bar"><span id="lcdmode">MUZIEK</span><span id="count2"></span></div>

    <div id="empty" class="empty">
      <p>Geen muziek geladen<span class="blink">_</span></p>
      <button class="open" id="openBtn">Open my music folder</button>
      <button class="link" id="pickBtn">or pick individual files</button>
      <small>Choose the folder you copied off the old player. Nothing is uploaded; the songs never leave this computer. Keep soulshine.json in that folder for titles and verdicts.</small>
    </div>

    <div id="player" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="now">
        <div class="title" id="title">Kies een nummer</div>
        <div class="sub" id="sub"></div>
        <div class="chips" id="chips"></div>
        <div class="remark" id="remark"></div>
      </div>
      <div class="msg" id="msg" role="status"></div>
      <div class="seekrow">
        <span id="cur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
        <span id="dur">0:00</span>
      </div>
      <div class="filters">
        <input type="search" id="q" placeholder="Zoeken…" aria-label="Search title, artist, album">
        <select id="fv" aria-label="Filter by verdict"><option value="">All verdicts</option></select>
        <select id="fg" aria-label="Filter by genre"><option value="">All genres</option></select>
      </div>
      <div class="count" id="count"></div>
      <div class="list" id="list"></div>
    </div>
  </div>

  <div class="keys">
    <button class="btn" id="shuf" title="Shuffle" aria-label="Shuffle" aria-pressed="false">⤮</button>
    <button class="btn" id="prev" title="Previous" aria-label="Previous">◀◀</button>
    <button class="btn big" id="play" title="Play / pause" aria-label="Play">▶</button>
    <button class="btn" id="next" title="Next" aria-label="Next">▶▶</button>
    <button class="btn" id="reopen" title="Open a different folder" aria-label="Open a different folder">⏏</button>
  </div>
  <div class="foot"><span class="grille"></span><span class="made">ALDER HOUSE · EST. 2005</span></div>
</div>

<input type="file" id="dir" webkitdirectory multiple class="hidden">
<input type="file" id="files" multiple accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.json" class="hidden">
<audio id="audio" preload="metadata"></audio>

<script>
(function () {
  'use strict';
  var AUDIO_EXT = /\.(mp3|m4a|wav|aac|ogg|oga|flac)$/i;
  var VCOL = {
    'Banger': '#7fd4a0',
    'Solid': '#9db8ff',
    'Guilty pleasure': '#e87ba0',
    'Explain yourself Fallon': '#ff7a6b',
    'Unheard - reserving judgement': '#9a9a9a',
    'Not a song': '#c9a27a',
    'Mystery file': '#c39bff'
  };
  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');
  var tracks = [];      // all tracks: {f,t,a,al,y,g,l,v,r,file}
  var view = [];        // indexes into tracks after filtering
  var cur = -1;         // index into tracks
  var shuffle = false;
  var objUrl = null;
  var history = [];
  var failStreak = 0;

  function fmt(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    s = Math.floor(s);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }

  function loadFiles(fileList) {
    var all = Array.prototype.slice.call(fileList);
    var byName = {};
    var metaFile = null;
    all.forEach(function (f) {
      var n = f.name.toLowerCase();
      if (n === 'soulshine.json') metaFile = f;
      else if (AUDIO_EXT.test(n) && !(n in byName)) byName[n] = f;
    });
    var audioCount = Object.keys(byName).length;
    if (!audioCount) {
      alert('No music files found in there. Pick the folder that holds the F00, F01… folders.');
      return;
    }
    var finish = function (meta) {
      tracks = [];
      var used = {};
      (meta || []).forEach(function (m) {
        var key = String(m.f || '').toLowerCase();
        var t = { f: m.f, t: m.t || m.f, a: m.a || '', al: m.al || '', y: m.y || '', g: m.g || '', l: m.l || '', v: m.v || '', r: m.r || '', file: byName[key] || null };
        if (t.file) used[key] = true;
        tracks.push(t);
      });
      Object.keys(byName).sort().forEach(function (key) {
        if (!used[key]) tracks.push({ f: byName[key].name, t: byName[key].name, a: '', al: '', y: '', g: '', l: '', v: '', r: '', file: byName[key] });
      });
      // playable ones first when there is metadata with gaps
      buildFilters();
      $('empty').classList.add('hidden');
      $('player').classList.remove('hidden');
      applyFilter();
      var playable = tracks.filter(function (t) { return t.file; }).length;
      say(meta ? playable + ' / ' + tracks.length + ' nummers gevonden' : audioCount + ' files. No soulshine.json in that folder, so names only.');
      $('lcdmode').textContent = 'NUMMERS';
    };
    if (metaFile) {
      metaFile.text().then(function (txt) {
        var meta = null;
        try { meta = JSON.parse(txt); } catch (e) { meta = null; }
        finish(Array.isArray(meta) ? meta : null);
      }, function () { finish(null); });
    } else {
      finish(null);
    }
  }

  function buildFilters() {
    var vs = {}, gs = {};
    tracks.forEach(function (t) { if (t.v) vs[t.v] = 1; if (t.g) gs[t.g] = 1; });
    fill($('fv'), 'All verdicts', Object.keys(VCOL).filter(function (v) { return vs[v]; }));
    fill($('fg'), 'All genres', Object.keys(gs).sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; }));
    $('fv').classList.toggle('hidden', !Object.keys(vs).length);
    $('fg').classList.toggle('hidden', !Object.keys(gs).length);
  }
  function fill(sel, first, opts) {
    sel.textContent = '';
    var o = document.createElement('option'); o.value = ''; o.textContent = first; sel.appendChild(o);
    opts.forEach(function (v) { var e = document.createElement('option'); e.value = v; e.textContent = v; sel.appendChild(e); });
  }

  function applyFilter() {
    var q = $('q').value.trim().toLowerCase();
    var fv = $('fv').value, fg = $('fg').value;
    view = [];
    tracks.forEach(function (t, i) {
      if (fv && t.v !== fv) return;
      if (fg && t.g !== fg) return;
      if (q && (t.t + ' ' + t.a + ' ' + t.al + ' ' + t.f).toLowerCase().indexOf(q) < 0) return;
      view.push(i);
    });
    renderList();
  }

  function renderList() {
    var list = $('list');
    list.textContent = '';
    var frag = document.createDocumentFragment();
    view.forEach(function (i) {
      var t = tracks[i];
      var row = document.createElement('button');
      row.className = 'row' + (i === cur ? ' cur' : '') + (t.file ? '' : ' missing');
      row.dataset.i = i;
      if (!t.file) { row.disabled = true; row.title = 'File not found in the folder you opened'; }
      var dot = document.createElement('span'); dot.className = 'dot';
      if (VCOL[t.v]) dot.style.setProperty('--vc', VCOL[t.v]);
      var rt = document.createElement('span'); rt.className = 'rt';
      var b = document.createElement('b'); b.textContent = t.t; rt.appendChild(b);
      if (t.a) { var a = document.createElement('i'); a.textContent = '  ' + t.a; rt.appendChild(a); }
      var rl = document.createElement('span'); rl.className = 'rl'; rl.textContent = t.l;
      row.appendChild(dot); row.appendChild(rt); row.appendChild(rl);
      frag.appendChild(row);
    });
    list.appendChild(frag);
    $('count').textContent = view.length + (view.length === 1 ? ' nummer' : ' nummers');
  }

  function say(text) { $('msg').textContent = text || ''; }

  function showNow(t) {
    $('title').textContent = t.t;
    $('sub').textContent = [t.a, t.al, t.y].filter(Boolean).join(' · ');
    var chips = $('chips'); chips.textContent = '';
    if (t.g) { var g = document.createElement('span'); g.className = 'chip'; g.textContent = '[' + t.g + ']'; chips.appendChild(g); }
    if (t.v) {
      var v = document.createElement('span'); v.className = 'chip v'; v.textContent = '[' + t.v + ']';
      if (VCOL[t.v]) v.style.setProperty('--vc', VCOL[t.v]);
      chips.appendChild(v);
    }
    var r = $('remark'); r.textContent = '';
    if (t.r) {
      r.appendChild(document.createTextNode('“' + t.r + '” '));
      var s = document.createElement('span'); s.textContent = '— Dax'; r.appendChild(s);
    }
  }

  function playIndex(i, fromHistory) {
    var t = tracks[i];
    if (!t || !t.file) return;
    if (cur >= 0 && !fromHistory) history.push(cur);
    if (history.length > 200) history.shift();
    cur = i;
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(t.file);
    audio.src = objUrl;
    showNow(t);
    say('');
    $('lcdmode').textContent = 'HUIDIG NUMMER';
    var p = audio.play();
    if (p && p.catch) p.catch(function () {});
    markCurrent();
  }

  function markCurrent() {
    var rows = $('list').children;
    for (var k = 0; k < rows.length; k++) {
      var on = Number(rows[k].dataset.i) === cur;
      rows[k].classList.toggle('cur', on);
      if (on && rows[k].scrollIntoView) rows[k].scrollIntoView({ block: 'nearest' });
    }
  }

  function playable() { return view.filter(function (i) { return tracks[i].file; }); }

  function next() {
    var p = playable();
    if (!p.length) return;
    var pos = p.indexOf(cur), n;
    if (shuffle && p.length > 1) {
      do { n = p[Math.floor(Math.random() * p.length)]; } while (n === cur);
    } else {
      n = p[(pos + 1) % p.length];
    }
    playIndex(n);
  }
  function prev() {
    if (audio.currentTime > 4) { audio.currentTime = 0; return; }
    if (history.length) { playIndex(history.pop(), true); return; }
    var p = playable();
    if (!p.length) return;
    var pos = p.indexOf(cur);
    playIndex(p[(pos - 1 + p.length) % p.length], true);
  }
  function toggle() {
    if (cur < 0) { next(); return; }
    if (audio.paused) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); } else audio.pause();
  }

  // events
  $('openBtn').addEventListener('click', function () { $('dir').click(); });
  $('pickBtn').addEventListener('click', function () { $('files').click(); });
  $('reopen').addEventListener('click', function () { $('dir').click(); });
  $('dir').addEventListener('change', function (e) { if (e.target.files.length) loadFiles(e.target.files); e.target.value = ''; });
  $('files').addEventListener('change', function (e) { if (e.target.files.length) loadFiles(e.target.files); e.target.value = ''; });

  $('list').addEventListener('click', function (e) {
    var row = e.target.closest ? e.target.closest('.row') : null;
    if (row && !row.disabled) { failStreak = 0; playIndex(Number(row.dataset.i)); }
  });
  $('q').addEventListener('input', applyFilter);
  $('fv').addEventListener('change', applyFilter);
  $('fg').addEventListener('change', applyFilter);
  $('play').addEventListener('click', toggle);
  $('next').addEventListener('click', function () { failStreak = 0; next(); });
  $('prev').addEventListener('click', function () { failStreak = 0; prev(); });
  $('shuf').addEventListener('click', function () {
    shuffle = !shuffle;
    $('shuf').classList.toggle('on', shuffle);
    $('shuf').setAttribute('aria-pressed', String(shuffle));
  });

  audio.addEventListener('play', function () { $('play').textContent = '❚❚'; $('play').setAttribute('aria-label', 'Pause'); });
  audio.addEventListener('pause', function () { $('play').textContent = '▶'; $('play').setAttribute('aria-label', 'Play'); });
  audio.addEventListener('playing', function () { failStreak = 0; });
  audio.addEventListener('ended', next);
  audio.addEventListener('error', function () {
    if (cur < 0) return;
    var name = tracks[cur].t;
    failStreak++;
    if (failStreak >= 3) { say('Several files in a row would not play. Stopping here.'); return; }
    say('“' + name + '” would not play in the browser (old or protected file). Skipping.');
    setTimeout(next, 900);
  });
  var seeking = false;
  audio.addEventListener('timeupdate', function () {
    $('cur').textContent = fmt(audio.currentTime);
    if (!seeking && isFinite(audio.duration) && audio.duration > 0) $('seek').value = Math.round(audio.currentTime / audio.duration * 1000);
  });
  audio.addEventListener('durationchange', function () { $('dur').textContent = fmt(audio.duration); });
  $('seek').addEventListener('input', function () { seeking = true; });
  $('seek').addEventListener('change', function () {
    if (isFinite(audio.duration)) audio.currentTime = $('seek').value / 1000 * audio.duration;
    seeking = false;
  });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (e.code === 'Space' && tag !== 'input' && tag !== 'select' && tag !== 'button') { e.preventDefault(); toggle(); }
  });
})();
</script>
<script>
(function () {
  var a = document.getElementById('audio'), led = document.getElementById('led');
  a.addEventListener('play', function () { led.classList.add('on'); });
  a.addEventListener('pause', function () { led.classList.remove('on'); });
  var c = document.getElementById('count'), c2 = document.getElementById('count2');
  new MutationObserver(function () { c2.textContent = c.textContent; }).observe(c, { childList: true, characterData: true, subtree: true });
})();
</script>
</body>
</html>
